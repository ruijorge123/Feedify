        <script>
          // Chrome/Edge fire beforeinstallprompt as soon as install criteria are met — often
          // before React has mounted and attached its own listener, which would silently lose
          // the event (it only fires once per page load). Capturing it here, at the very top
          // of <head>, guarantees it's caught regardless of how long the app takes to load.
          window.__pwaInstallPrompt = null;
          window.addEventListener("beforeinstallprompt", function (e) {
            e.preventDefault();
            window.__pwaInstallPrompt = e;
            window.dispatchEvent(new CustomEvent("pwa-install-ready"));
          });
        </script>

        <title>Feedify</title>

        <script>
          // Suppress harmless ResizeObserver notification — CRA dev overlay false-positive
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('ResizeObserver loop') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return false;
            }
          }, true);
        </script>
