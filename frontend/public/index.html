<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B3D2E" />
        <meta name="description" content="Feedify — Platform konten media sosial untuk UMKM Indonesia" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- PWA — installable on Android/Desktop (Chrome/Edge), iOS/iPadOS Safari, macOS Safari -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/icon-192.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Feedify" />
        <meta name="mobile-web-app-capable" content="yes" />

        <title>Feedify</title>
        <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
        <script>
          window.OneSignalDeferred = window.OneSignalDeferred || [];
          OneSignalDeferred.push(async function (OneSignal) {
            await OneSignal.init({ appId: "%REACT_APP_ONESIGNAL_APP_ID%" });
          });
        </script>
    </head>
    <body>
        <script>
          // Suppress harmless ResizeObserver notification — CRA dev overlay false-positive
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('ResizeObserver loop') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return false;
            }
          }, true);
        </script>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
